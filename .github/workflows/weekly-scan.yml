name: Weekend Full Scan

on:
  # 예약 실행은 비활성화했습니다. 필요할 때만 Actions 화면에서 실행합니다.
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full universe scan (사전 스크리닝 → 전체 신호)
        run: python scripts/explore.py --eu-all --prescreen --notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/journals/
          git diff --cached --quiet || git commit -m "chore: weekend full scan $(date -u +%Y-%m-%d)"
          git push
